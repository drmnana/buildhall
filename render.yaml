# Render Blueprint — Buildhall sync server
# Docs: https://render.com/docs/blueprint-spec
#
# STORAGE: Postgres (Render managed). The web service connects via DATABASE_URL,
# set in the Render dashboard (Environment) — not here, since it is a secret. The
# database itself was provisioned outside this blueprint, so it is intentionally
# NOT declared under `databases:` (declaring it here could make a blueprint sync
# try to create a second instance). See docs/POSTGRES-CUTOVER.md for the history.
#
# NOTE ON PLAN: `starter` is deliberate. The service no longer needs a persistent
# disk (that was for the old SQLite database); it is kept on a paid tier for
# always-on behaviour (the free tier spins down when idle).
#
# NOTE ON SECRETS: nothing secret belongs in this file. Admin credentials / API
# keys live in the Render dashboard under Environment (or here with `sync: false`,
# which commits the key name but never the value). DATABASE_URL and every
# BACKUP_S3_* value are set there.

services:
  - type: web
    name: buildhall
    runtime: node
    plan: starter
    region: oregon         # must match the Postgres region for internal connectivity
    branch: main
    autoDeploy: true

    buildCommand: npm install
    startCommand: npm start

    # Render polls this to gate deploys and restart unhealthy instances. Returns
    # 200 when Postgres is reachable (SELECT 1), 503 if not.
    healthCheckPath: /health

    envVars:
      # node:sqlite (used only by offline migration/import scripts) and the pg
      # driver both want a current Node; "22" tracks the latest 22.x.
      - key: NODE_VERSION
        value: "22"
      # DATABASE_URL and BACKUP_S3_* are set in the dashboard (secrets).
